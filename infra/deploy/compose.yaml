name: agentforge
x-app: &app
  image: agentforge-api:${RELEASE_TAG:?set RELEASE_TAG to the reviewed commit}
  build:
    context: ../..
    dockerfile: infra/deploy/api.Dockerfile
  env_file: ${RUNTIME_ENV_FILE:-/etc/agentforge/runtime.env}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 120s
  volumes:
    - ${DATA_ROOT:-/srv/agentforge}/artifacts:/data/artifacts
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a unique database password}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?set a distinct runtime database password}
    volumes:
      - ${DATA_ROOT:-/srv/agentforge}/postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-agentforge.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentforge_admin -d agentforge"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migration:
    <<: *app
    profiles: [setup]
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set the admin migration URL}
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    # Open event streams would otherwise hold shutdown until the stop grace period ends in SIGKILL; after 10s they are
    # closed, and browsers reconnect (EventSource) to the new container.
    command: [uvicorn, "agentforge.main:app", --host, "0.0.0.0", --port, "8000", --proxy-headers, --forwarded-allow-ips, "172.29.237.10", --no-access-log, --timeout-graceful-shutdown, "10"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, agentforge.workers.runner]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: agentforge-web:${RELEASE_TAG:?set RELEASE_TAG}
    build:
      context: ../..
      dockerfile: infra/deploy/web.Dockerfile
      args:
        # Public pages are prerendered with it (social cards, sitemap, robots), so a build without it is refused.
        SITE_URL: ${SITE_URL:?set SITE_URL to the public origin}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: nginx:1.30.5-trixie
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_ROOT:-/etc/agentforge/tls}:/etc/agentforge/tls:ro
    depends_on: [api, web]
    networks:
      default:
        ipv4_address: 172.29.237.10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.237.0/24
