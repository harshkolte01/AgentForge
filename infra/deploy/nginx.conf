events { worker_connections 1024; }
http {
    # OAuth callback query strings contain one-use credentials; do not log them.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s;
    # Sign-in is limited per client: an IPv4 address, or an IPv6 /64 (the first 8 of 16 bytes), since one
    # IPv6 host usually controls its whole /64. The API's DB-wide ceiling is only a backstop.
    map $binary_remote_addr $auth_client {
        "~(?s)^(?<prefix>.{8}).{8}$" $prefix;
        default $binary_remote_addr;
    }
    limit_req_zone $auth_client zone=auth:10m rate=10r/m;
    server {
        listen 80 default_server;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl default_server;
        # HTTP/2 to browsers (event streams no longer use up the six HTTP/1.1 connections a browser allows per site);
        # upstreams stay on HTTP/1.1 keep-alive (proxy_http_version below).
        http2 on;
        ssl_certificate /etc/agentforge/tls/fullchain.pem;
        ssl_certificate_key /etc/agentforge/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Inherited by every location below only while none of them has an add_header of its own: one that does must
        # repeat all of these.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
        # API JSON and text compress well. Never text/event-stream: compression buffers, and a stream must reach the
        # browser as it is written. (text/html is always compressed once gzip is on.)
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/json text/plain text/css application/javascript;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        location ~ ^/api/v1/auth/github/(start|callback)$ {
            # Upstream errors can include the OAuth query string too.
            error_log /dev/null;
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            set $api http://api:8000;
            proxy_pass $api;
        }
        location = /api/v1/attachments {
            client_max_body_size 8m;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_request_buffering off;
            proxy_read_timeout 75s;
        }
        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
        }
        location / {
            set $web http://web:3000;
            proxy_pass $web;
            proxy_buffering off;
            proxy_read_timeout 75s;
        }
    }
}
