events { worker_connections 1024; }
http {
    # OAuth callback query strings contain one-use credentials; do not log them.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    server {
        listen 80 default_server;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/agentforge/tls/fullchain.pem;
        ssl_certificate_key /etc/agentforge/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        location ~ ^/api/v1/auth/github/(start|callback)$ {
            # Upstream errors can include the OAuth query string too.
            error_log /dev/null;
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            set $api http://api:8000;
            proxy_pass $api;
        }
        location ~ ^/api/v1/approvals/[^/]+/execute$ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
        }
        location / {
            set $web http://web:3000;
            proxy_pass $web;
            proxy_buffering off;
            proxy_read_timeout 75s;
        }
    }
}
