name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://agentforge:isolated-ci-password@127.0.0.1:5432/postgres
      LANGGRAPH_CHECKPOINT_DB_URL: postgresql://agentforge:isolated-ci-password@127.0.0.1:5432/postgres
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://agentforge:isolated-ci-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: 0.13.0
          python-version: 3.12.15
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --project apps/api python scripts/release_checks.py --skip-web
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24.21.0}
      - run: npm install --global pnpm@10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env: {NEXT_TELEMETRY_DISABLED: "1"}
